<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseWatch — Uptime Monitoring</title>    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Auth view -->
    <section id="auth-view" class="auth-wrap hidden">
      <div class="auth-card">
        <h1 class="brand">⚡ PulseWatch</h1>
        <p class="muted" id="auth-subtitle">Sign in to your monitoring dashboard</p>
        <form id="auth-form">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" />
          <button type="submit" id="auth-submit" class="btn primary full">Sign in</button>
        </form>
        <p class="muted small" id="auth-toggle-line">
          No account? <a href="#" id="auth-toggle">Create one</a>
        </p>
        <p id="auth-error" class="error-text hidden"></p>
      </div>
    </section>

    <!-- Dashboard view -->
    <section id="dash-view" class="hidden">
      <header class="topbar">
        <span class="brand small-brand">⚡ PulseWatch</span>
        <nav class="topnav">
          <a href="/" id="nav-dashboard" class="active">Dashboard</a>
          <a href="/status.html">Public status page</a>
        </nav>
        <button id="logout-btn" class="btn ghost">Log out</button>
      </header>

      <main class="container">
        <div class="row-between">
          <h2>Your monitors</h2>
          <button id="new-monitor-btn" class="btn primary">+ New monitor</button>
        </div>

        <div class="toolbar">
          <input id="search-input" type="search" placeholder="Filter by name or URL…" aria-label="Filter monitors" />
          <select id="state-filter" aria-label="Filter by state">
            <option value="all">All states</option>
            <option value="up">Up</option>
            <option value="down">Down</option>
            <option value="paused">Paused</option>
          </select>
        </div>

        <div id="summary-cards" class="cards"></div>
        <div id="monitor-list" class="monitor-list" role="list"></div>
        <p id="empty-state" class="muted center hidden">No monitors yet. Create your first one above.</p>
      </main>
    </section>
  </div>

  <!-- New monitor dialog -->
  <dialog id="monitor-dialog">
    <form id="monitor-form" method="dialog">
      <h3>New monitor</h3>
      <label for="m-name">Name</label>
      <input id="m-name" required maxlength="120" placeholder="Marketing site" />
      <label for="m-url">URL</label>
      <input id="m-url" type="url" required placeholder="https://example.com/health" />
      <div class="grid2">
        <div>
          <label for="m-interval">Interval (seconds)</label>
          <input id="m-interval" type="number" min="10" max="3600" value="60" />
        </div>
        <div>
          <label for="m-status">Expected status</label>
          <input id="m-status" type="number" min="100" max="599" value="200" />
        </div>
      </div>
      <p id="monitor-error" class="error-text hidden"></p>
      <div class="dialog-actions">
        <button type="button" class="btn ghost" id="monitor-cancel">Cancel</button>
        <button type="submit" class="btn primary">Create</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
